<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <span class="mark" aria-hidden="true">+</span>
      <div>
        <h1>Book an appointment</h1>
        <p class="sub">Pick an open slot, add your details, and you're booked.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Step 1: slots -->
    <section id="slots-section" aria-labelledby="slots-title">
      <div class="section-head">
        <h2 id="slots-title"><span class="step">1</span> Choose a slot</h2>
        <label class="filter">
          <span>Doctor</span>
          <select id="provider-filter"><option value="">All doctors</option></select>
        </label>
      </div>
      <p id="slots-status" class="muted" role="status">Loading slots…</p>
      <div id="slots"></div>
    </section>

    <!-- Step 2: details -->
    <section id="form-section" hidden aria-labelledby="form-title">
      <h2 id="form-title"><span class="step">2</span> Your details</h2>
      <div class="chosen" id="chosen-slot"></div>
      <form id="booking-form" novalidate>
        <label>Full name
          <input id="name" name="name" autocomplete="name" required>
        </label>
        <label>Email
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <p id="form-error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="ghost" id="change-slot">Change slot</button>
          <button type="submit" id="submit-btn">Confirm booking</button>
        </div>
      </form>
    </section>

    <!-- Step 3: confirmation -->
    <section id="confirm-section" hidden aria-labelledby="confirm-title">
      <h2 id="confirm-title"><span class="step done">✓</span> You're booked</h2>
      <div class="ticket" id="ticket"></div>
      <button type="button" id="book-another">Book another slot</button>
    </section>

    <!-- Look up a booking -->
    <section class="lookup" aria-labelledby="lookup-title">
      <h2 id="lookup-title">Find a booking</h2>
      <form id="lookup-form" class="inline">
        <input id="lookup-id" placeholder="Booking ID" aria-label="Booking ID" required>
        <button type="submit" class="ghost">Look up</button>
      </form>
      <div id="lookup-result"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
